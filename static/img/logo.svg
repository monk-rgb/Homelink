<?xml version="1.0" encoding="UTF-8"?>
<!-- Homelink brand mark.
     Colours are taken from the site palette: gold #DEB631 -> #F3D46A gradient
     on the dark panel colour #0B0B0B. To use your own artwork instead, replace
     this file with your SVG/PNG and keep the filename and 64x64 viewBox. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Homelink">
 <defs>
    <linearGradient id="hl-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F3D46A"/>
      <stop offset="55%" stop-color="#DEB631"/>
      <stop offset="100%" stop-color="#B8912A"/>
    </linearGradient>
 </defs>
  <!-- Rounded dark tile -->
 <rect x="0" y="0" width="64" height="64" rx="14" fill="#0B0B0B"/>
 <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" fill="none"
        stroke="url(#hl-gold)" stroke-width="1.5" opacity="0.55"/>
  <!-- House: a single closed outline. The walls stop well above the tile edge
       so there is clean interior space for the link below. -->
 <path d="M13 31 L32 14 L51 31" fill="none" stroke="url(#hl-gold)"
        stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
 <path d="M19 29 V44 a3 3 0 0 0 3 3 h20 a3 3 0 0 0 3 -3 V29"
        fill="none" stroke="url(#hl-gold)" stroke-width="3.6"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Chain link inside the house body: two rings side by side, the left one
       drawn over the right so they read as linked, not as two separate circles. -->
 <g fill="none" stroke-width="2.2">
   <circle cx="28.5" cy="38" r="5.4" stroke="url(#hl-gold)"/>
   <circle cx="35.5" cy="38" r="5.4" stroke="url(#hl-gold)"/>
   <!-- Knock out the overlap so the left ring passes in front of the right. -->
   <path d="M28.5 32.6 a5.4 5.4 0 0 1 0 10.8" stroke="#0B0B0B" stroke-width="4"/>
   <path d="M28.5 32.6 a5.4 5.4 0 0 1 0 10.8" stroke="url(#hl-gold)" stroke-width="2.2"/>
 </g>
</svg>
